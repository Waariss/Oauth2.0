<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OAuth Inspector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 12px;
            color: #1f2937;
        }

        .container {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            background-color: #ffffff;
            padding: 14px;
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
        }

        .status,
        .risk-badge {
            font-size: 12px;
            margin: 0;
            padding: 6px 8px;
            border-radius: 6px;
        }

        .status {
            background: #eef2ff;
            color: #3730a3;
        }

        .risk-badge {
            display: inline-block;
            font-weight: 700;
            width: fit-content;
        }

        .risk-low {
            background: #ecfdf3;
            color: #027a48;
        }

        .risk-medium {
            background: #fffaeb;
            color: #b54708;
        }

        .risk-high {
            background: #fef3f2;
            color: #b42318;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #6b7280;
        }

        .value {
            font-size: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 6px 8px;
            overflow-wrap: anywhere;
        }

        .list {
            margin: 0;
            padding-left: 18px;
            color: #334155;
            font-size: 12px;
        }

        .list li {
            margin-bottom: 4px;
        }

        #removeCode {
            background: #4285f4;
            border: none;
            color: #fff;
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            transition: all 0.3s ease;
        }

        #removeCode:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="title">OAuth 2.0 Flow Inspector</p>
        <p class="status" id="status">No OAuth parameters captured yet.</p>
        <p class="risk-badge risk-medium" id="riskBadge">Verdict: waiting for callback</p>

        <div class="field">
            <span class="label">Assessment findings</span>
            <ul class="list" id="findings">
                <li>No findings yet.</li>
            </ul>
        </div>

        <div class="field">
            <span class="label">Authorization code</span>
            <div class="value" id="authCode">Not found</div>
        </div>

        <div class="field">
            <span class="label">State</span>
            <div class="value" id="state">Not found</div>
        </div>

        <div class="field">
            <span class="label">Nonce</span>
            <div class="value" id="nonce">Not found</div>
        </div>

        <div class="field">
            <span class="label">Response type</span>
            <div class="value" id="responseType">Not found</div>
        </div>

        <div class="field">
            <span class="label">Captured URL</span>
            <div class="value" id="capturedUrl">Not found</div>
        </div>

        <div class="field">
            <span class="label">Last auth request URL</span>
            <div class="value" id="requestUrl">Not found</div>
        </div>

        <button id="removeCode">Clear captured sessions</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
